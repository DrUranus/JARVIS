# Controller: startet nach einem akzeptierten Bericht hoechstens EINEN Folgeauftrag aus dem Backlog.
# Entscheidung nur aus dem Issue-Zustand (nicht aus Eingaben oder Berichtstext) und nur, wenn alle Grenzen erfuellt sind
# (siehe decide_followup in .github/automation/jarvis_automation.py). Wird von jarvis-report.yml / jarvis-watchdog.yml angestossen.
name: JARVIS controller

on:
  workflow_dispatch:
    inputs:
      after_job:
        description: "Issue-Nummer des abgeschlossenen Auftrags (leer bei Korrekturauftrag)"
        required: false
        type: string
      repair_pr:
        description: "PR-Nummer fuer einen Korrekturauftrag (vom Merge-Gate; wird dort neu geprueft)"
        required: false
        type: string
      repair_sha:
        description: "Head-Commit des PR, auf den sich die Anforderung bezieht"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

concurrency:
  group: jarvis-job-create
  cancel-in-progress: false

jobs:
  controller:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/automation

      - name: Decide and start follow-up
        if: ${{ inputs.repair_pr == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          AFTER_JOB: ${{ inputs.after_job }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          JARVIS_AUTOMATION_HALT: ${{ vars.JARVIS_AUTOMATION_HALT }}
          JARVIS_BASE_BRANCH: ${{ vars.JARVIS_BASE_BRANCH }}
          JARVIS_AUTO_CONTINUE_ENABLED: ${{ vars.JARVIS_AUTO_CONTINUE_ENABLED }}
          JARVIS_MAX_CHAIN_JOBS: ${{ vars.JARVIS_MAX_CHAIN_JOBS }}
          JARVIS_MAX_JOBS_PER_DAY: ${{ vars.JARVIS_MAX_JOBS_PER_DAY }}
        run: python3 .github/automation/jarvis_automation.py controller

      - name: Start repair job for a failing pull request
        if: ${{ inputs.repair_pr != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          REPAIR_PR: ${{ inputs.repair_pr }}
          REPAIR_SHA: ${{ inputs.repair_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          JARVIS_AUTOMATION_HALT: ${{ vars.JARVIS_AUTOMATION_HALT }}
          JARVIS_TRUSTED_REPORTERS: ${{ vars.JARVIS_TRUSTED_REPORTERS }}
          JARVIS_AUTO_CONTINUE_ENABLED: ${{ vars.JARVIS_AUTO_CONTINUE_ENABLED }}
          JARVIS_MAX_JOBS_PER_DAY: ${{ vars.JARVIS_MAX_JOBS_PER_DAY }}
        run: python3 .github/automation/merge_gate.py repair
