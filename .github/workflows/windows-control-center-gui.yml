name: Windows Control Center browser GUI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/jarvis/control_center/**'
      - 'tests/test_control_center_browser_gui.py'
      - '.github/workflows/windows-control-center-gui.yml'

permissions:
  contents: read

concurrency:
  group: cc-browser-gui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-browser-gui:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]" "playwright>=1.49,<2"
          python -m playwright install chromium
      - name: Exercise real Chromium DOM and capture GUI evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports/gui | Out-Null
          python -m pytest -v -rs tests/test_control_center_browser_gui.py --junitxml=reports/gui/junit.xml
      - name: Upload evidence, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-control-center-browser-gui
          path: reports/gui/
          if-no-files-found: warn
          retention-days: 14
