# Tests (Windows + Linux). Liest nur (contents: read): keine Secrets, kein Schreibzugriff, kein automatischer Commit/Push.
# Trigger: push auf den Arbeitsbranch (damit der erste Lauf nicht davon abhaengt, dass die Datei auf main liegt) und manuell (workflow_dispatch).
#   push                          -> gui-windows (schnell: GUI- und Voice-Tests unter Windows)
#   push mit "[ci-phase15]"       -> zusaetzlich phase15-windows (ACL-/Job-Object-/Junction-Tests, langsam: PowerShell ist auf dem Runner traege)
#   push mit "[ci-full]"          -> zusaetzlich die volle Suite (Windows + Linux)
#   workflow_dispatch             -> scope: gui | phase15 | full | all, repeat: 1-50 (nur nutzbar, wenn die Datei auf dem Standard-Branch liegt)
# Actions sind auf Commit-SHAs gepinnt (Tag im Kommentar); bei Aktualisierung SHA gegen den offiziellen Tag pruefen.
name: tests

on:
  push:
    branches: ["claude/inspiring-ritchie-8ljinw"]
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/tests.yml"]
  workflow_dispatch:
    inputs:
      scope:
        description: "Umfang: gui = GUI/Voice unter Windows, phase15 = gezielte Windows-Tests, full = volle Suite (Windows + Linux), all = alles"
        type: choice
        options: [gui, phase15, full, all]
        default: gui
      repeat:
        description: "Wiederholungen des Prozessbaum-Tests (1-50)"
        type: string
        default: "20"

permissions:
  contents: read                           # minimal: kein Schreibzugriff, keine Secrets, kein GITHUB_TOKEN-Einsatz im Code

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash                            # Git Bash auch unter Windows; bash laeuft mit -e -o pipefail

jobs:
  gui-windows:
    name: gui + voice + emergency stop (windows-latest, py3.13)
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'gui' || inputs.scope == 'all')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: "Stand pruefen (GUI- und Notaus-Dateien muessen im Checkout enthalten sein)"
        run: |
          mkdir -p reports
          sha="$(git rev-parse HEAD)"; echo "Geprueft wird Commit $sha"
          { echo "Commit: $sha"; echo "Ref: $GITHUB_REF"; } | tee reports/commit.txt >> "$GITHUB_STEP_SUMMARY"
          for f in src/jarvis/interface/gui_model.py src/jarvis/permissions/emergency.py tests/test_gui_view.py tests/test_gui_model.py tests/test_voice_state.py tests/test_emergency_stop.py; do
            [ -f "$f" ] || { echo "::error::$f fehlt - der Lauf gilt nicht als GUI-Nachweis."; exit 1; }
          done
      - name: "Installieren (dev + voice: sounddevice/numpy fuer test_voice)"
        run: python -m pip install --disable-pip-version-check -e ".[dev,voice]"
      - name: "Diagnose (nur Information): Python, tkinter, Anzeige"
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys, tkinter
          print(sys.version)
          print("Tk", tkinter.TkVersion)
          root = tkinter.Tk()
          print("Tk-Fenster moeglich; Bildschirm:", root.winfo_screenwidth(), "x", root.winfo_screenheight())
          root.destroy()
          PY
      - name: GUI- und Voice-Tests
        env:
          JARVIS_GUI_TESTS_REQUIRED: "1"          # ein nicht startendes Tk soll hier fehlschlagen, nicht still ueberspringen
        run: |
          python -m pytest -p no:cacheprovider -rfEs --durations=10 --junitxml=reports/junit-gui-windows.xml \
            tests/test_gui_model.py tests/test_gui_view.py tests/test_gui_confirmation.py tests/test_voice_state.py tests/test_voice.py tests/test_voice_cli.py \
            tests/test_emergency_stop.py tests/test_security_engine.py tests/test_security_bypass.py tests/test_security_config.py tests/test_security_tools.py
      - name: "Zusammenfassung und Pflichtpruefung (GUI-Tests muessen wirklich gelaufen sein, nicht uebersprungen)"
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - reports/junit-gui-windows.xml >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, sys, collections, xml.etree.ElementTree as ET
          path = sys.argv[1]
          print(f"### GUI + Voice / Windows - Jobstatus bis hierher: **{os.environ.get('JOB_STATUS')}**\n")
          if not os.path.exists(path):
              print("**Kein Testbericht vorhanden - der Lauf ist NICHT als bestanden zu werten.**"); sys.exit(1)
          cases = list(ET.parse(path).getroot().iter("testcase"))
          n = collections.Counter(); skipped = []; passed = []
          for c in cases:
              ident = f"{c.get('classname')}::{c.get('name')}"
              if c.find("failure") is not None or c.find("error") is not None: n["FAILED/ERROR"] += 1; print(f"- FAILED/ERROR: {ident}")
              elif c.find("skipped") is not None: n["SKIPPED"] += 1; skipped.append((ident, (c.find("skipped").get("message") or "")[:100]))
              else: n["PASSED"] += 1; passed.append(c)
          print(f"\n| PASSED | FAILED/ERROR | SKIPPED |\n|---|---|---|\n| {n['PASSED']} | {n['FAILED/ERROR']} | {n['SKIPPED']} |\n")
          for ident, why in skipped: print(f"- SKIPPED: {ident} - {why}")
          required = ["tests.test_gui_view", "tests.test_gui_model", "tests.test_gui_confirmation", "tests.test_voice_state", "tests.test_emergency_stop", "tests.test_security_engine"]
          missing = [cls for cls in required if not any(c.get("classname") == cls for c in passed)]
          if n["PASSED"] == 0 or missing:
              print(f"\n**Pflichtpruefung FEHLGESCHLAGEN: kein bestandener Test in: {missing or 'gesamter Lauf'}** (uebersprungene Fenstertests zaehlen nicht)"); sys.exit(1)
          PY
      - name: Berichte hochladen (auch bei Fehlschlag)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-gui-windows
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  phase15-windows:
    name: phase 15 gezielt (windows-latest, py3.13)
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'phase15' || inputs.scope == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci-phase15]')) }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false         # Token bleibt nicht in .git/config zurueck
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: "Stand pruefen (Phase-15-Stand von Patch v4 muss im Checkout enthalten sein)"
        run: |
          mkdir -p reports
          sha="$(git rev-parse HEAD)"; echo "Geprueft wird Commit $sha"
          { echo "Commit: $sha"; echo "Ref: $GITHUB_REF"; } | tee reports/commit.txt >> "$GITHUB_STEP_SUMMARY"
          missing=0
          chk() { grep -q -- "$2" "$1" || { echo "::error::Marker fehlt in $1: $2"; missing=1; }; }
          chk src/jarvis/self_improvement/workspace.py "_contain_and_resume"
          chk src/jarvis/self_improvement/winjob.py "def resume"
          chk src/jarvis/self_improvement/winsec.py "OutputEncoding"
          chk tests/test_self_improvement_process_tree.py "test_win_a_resume_failure_leaves_no_frozen_process"
          chk tests/test_self_improvement_keyfile.py "def run_bytes"
          chk tests/test_self_improvement_security.py "JARVIS_SELF_IMPROVEMENT_STORE_KEY"
          if (( missing )); then
            echo "::error::Dieser Checkout enthaelt den Phase-15-Stand (Patch v4) NICHT - der Lauf gilt nicht als Phase-15-Nachweis."
            echo "**KEIN Phase-15-Nachweis: Marker des Patch-v4-Stands fehlen in $sha.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Installieren (dev)
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: "Diagnose (nur Information): laeuft dieser Prozess selbst in einem Job Object?"
        continue-on-error: true               # darf den Lauf nie scheitern lassen
        run: |
          python - <<'PY'
          import ctypes, ctypes.wintypes as w
          from jarvis.self_improvement import winjob
          k = ctypes.WinDLL("kernel32", use_last_error=True)
          k.GetCurrentProcess.restype = w.HANDLE
          k.IsProcessInJob.argtypes = [w.HANDLE, w.HANDLE, ctypes.POINTER(w.BOOL)]
          inside = w.BOOL()
          ok = k.IsProcessInJob(k.GetCurrentProcess(), None, ctypes.byref(inside))
          print("IsProcessInJob aufgerufen:", bool(ok), "| Prozess in einem Job:", bool(inside.value))
          if inside.value:
              _, ext = winjob.structs()
              info = ext()
              k.QueryInformationJobObject.argtypes = [w.HANDLE, ctypes.c_int, ctypes.c_void_p, w.DWORD, ctypes.c_void_p]
              got = k.QueryInformationJobObject(None, 9, ctypes.byref(info), ctypes.sizeof(info), None)
              print("LimitFlags des Jobs:", hex(info.BasicLimitInformation.LimitFlags) if got else "nicht lesbar")
          PY
      - name: Phase-15-Windows-Tests
        run: |
          mkdir -p reports
          python -m pytest -p no:cacheprovider -rfEs --durations=15 -W error::pytest.PytestUnhandledThreadExceptionWarning \
            --junitxml=reports/junit-phase15-windows.xml \
            tests/test_self_improvement_keyfile.py tests/test_self_improvement_lock.py tests/test_self_improvement_process_tree.py \
            tests/test_self_improvement_security.py tests/test_security_paths_windows.py
      - name: "Prozessbaum-Test wiederholen (Straggler)"
        if: ${{ !cancelled() }}               # laeuft auch nach einem Fehler des vorigen Schritts; der Job bleibt dann trotzdem rot
        env:
          REPEAT: ${{ inputs.repeat || '5' }}   # ueber env, nie direkt in das Skript interpoliert; push-Laeufe: 5
        run: |
          [[ "$REPEAT" =~ ^[0-9]+$ ]] && (( REPEAT >= 1 && REPEAT <= 50 )) || { echo "::error::repeat muss 1-50 sein"; exit 1; }
          fails=0
          for i in $(seq 1 "$REPEAT"); do
            python -m pytest -p no:cacheprovider -q tests/test_self_improvement_process_tree.py -k "left_running_after_a_normal_exit" \
              || { fails=$((fails+1)); echo "::warning::Lauf $i von $REPEAT fehlgeschlagen"; }
          done
          echo "Wiederholungen: $REPEAT, fehlgeschlagen: $fails"
          mkdir -p reports && echo "repeat=$REPEAT fails=$fails" > reports/straggler-repeat.txt
          (( fails == 0 ))
      - name: "Zusammenfassung und Pflichtpruefung (kein Windows-Test darf unbemerkt komplett uebersprungen sein)"
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - reports/junit-phase15-windows.xml >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, sys, collections, xml.etree.ElementTree as ET
          path = sys.argv[1]
          print(f"### Phase 15 / Windows - Jobstatus bis hierher: **{os.environ.get('JOB_STATUS')}**\n")
          if not os.path.exists(path):
              print("**Kein Testbericht vorhanden - der Lauf ist NICHT als bestanden zu werten.**"); sys.exit(1)
          cases = list(ET.parse(path).getroot().iter("testcase"))
          n = collections.Counter(); skipped = []; passed = []
          for c in cases:
              ident = f"{c.get('classname')}::{c.get('name')}"
              if c.find("failure") is not None or c.find("error") is not None: n["FAILED/ERROR"] += 1; print(f"- FAILED/ERROR: {ident}")
              elif c.find("skipped") is not None: n["SKIPPED"] += 1; skipped.append((ident, (c.find("skipped").get("message") or "")[:100]))
              else: n["PASSED"] += 1; passed.append(c)
          print(f"\n| PASSED | FAILED/ERROR | SKIPPED |\n|---|---|---|\n| {n['PASSED']} | {n['FAILED/ERROR']} | {n['SKIPPED']} |\n")
          for ident, why in skipped: print(f"- SKIPPED: {ident} - {why}")
          required = [("tests.test_self_improvement_process_tree", "test_win_"), ("tests.test_self_improvement_keyfile", "test_win_"), ("tests.test_security_paths_windows", "")]
          missing = [f"{cls}::{pre}*" for cls, pre in required if not any(c.get("classname") == cls and c.get("name").startswith(pre) for c in passed)]
          if n["PASSED"] == 0 or missing:
              print(f"\n**Pflichtpruefung FEHLGESCHLAGEN: kein bestandener Windows-Test in: {missing or 'gesamter Lauf'}**"); sys.exit(1)
          PY
      - name: Berichte hochladen (auch bei Fehlschlag)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-phase15-windows
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  suite:
    name: suite (${{ matrix.os }}, py${{ matrix.python }})
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci-full]')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.13" }   # Zielsystem
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: ubuntu-latest,  python: "3.11" }   # requires-python >=3.11; Laufzeit unter 3.11 bisher NICHT getestet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: "Stand pruefen (Phase-15-Stand von Patch v4 muss im Checkout enthalten sein)"
        run: |
          mkdir -p reports
          sha="$(git rev-parse HEAD)"; echo "Geprueft wird Commit $sha"
          { echo "Commit: $sha"; echo "Ref: $GITHUB_REF"; } | tee reports/commit.txt >> "$GITHUB_STEP_SUMMARY"
          missing=0
          chk() { grep -q -- "$2" "$1" || { echo "::error::Marker fehlt in $1: $2"; missing=1; }; }
          chk src/jarvis/self_improvement/workspace.py "_contain_and_resume"
          chk src/jarvis/self_improvement/winjob.py "def resume"
          chk src/jarvis/self_improvement/winsec.py "OutputEncoding"
          chk tests/test_self_improvement_process_tree.py "test_win_a_resume_failure_leaves_no_frozen_process"
          chk tests/test_self_improvement_keyfile.py "def run_bytes"
          chk tests/test_self_improvement_security.py "JARVIS_SELF_IMPROVEMENT_STORE_KEY"
          if (( missing )); then
            echo "::error::Dieser Checkout enthaelt den Phase-15-Stand (Patch v4) NICHT - der Lauf gilt nicht als Phase-15-Nachweis."
            echo "**KEIN Phase-15-Nachweis: Marker des Patch-v4-Stands fehlen in $sha.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: "Installieren (dev; unter Windows zusaetzlich das Extra voice: test_voice braucht sounddevice + numpy)"
        env:
          EXTRAS: ${{ runner.os == 'Windows' && 'dev,voice' || 'dev' }}
        run: python -m pip install --disable-pip-version-check -e ".[$EXTRAS]"
      - name: "Tests (volle Suite)"
        run: |
          mkdir -p reports
          # GUI-Tests: ohne tkinter/Anzeige ueberspringen sie sich selbst (Linux-Runner); unter Windows laufen sie.
          python -m pytest -p no:cacheprovider -rfEs \
            --junitxml="reports/junit-${{ matrix.os }}-py${{ matrix.python }}.xml"
      - name: Zusammenfassung (PASSED / FAILED / SKIPPED)
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
          REPORT: reports/junit-${{ matrix.os }}-py${{ matrix.python }}.xml
        run: |
          python - "$REPORT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, sys, collections, xml.etree.ElementTree as ET
          path = sys.argv[1]
          print(f"### {path} - Jobstatus bis hierher: **{os.environ.get('JOB_STATUS')}**\n")
          if not os.path.exists(path):
              print("**Kein Testbericht vorhanden - der Lauf ist NICHT als bestanden zu werten.**"); sys.exit(1)
          n = collections.Counter(); reasons = collections.Counter()
          for c in ET.parse(path).getroot().iter("testcase"):
              if c.find("failure") is not None or c.find("error") is not None: n["FAILED/ERROR"] += 1; print(f"- FAILED/ERROR: {c.get('classname')}::{c.get('name')}")
              elif c.find("skipped") is not None: n["SKIPPED"] += 1; reasons[(c.find("skipped").get("message") or "")[:100]] += 1
              else: n["PASSED"] += 1
          print(f"\n| PASSED | FAILED/ERROR | SKIPPED |\n|---|---|---|\n| {n['PASSED']} | {n['FAILED/ERROR']} | {n['SKIPPED']} |\n")
          for r, k in reasons.most_common(): print(f"- {k}x skipped: {r}")
          if n["PASSED"] == 0: sys.exit(1)
          PY
      - name: Berichte hochladen (auch bei Fehlschlag)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
