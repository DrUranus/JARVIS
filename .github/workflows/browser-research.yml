name: Browser Research (real Playwright)

# Aufgabe 6: echte Browser-Tests (Playwright/Chromium) fuer Browser-Agent und Browserrecherche auf Windows und Linux, nur gegen eine lokale Seite (127.0.0.1).
# Kein Internet fuer die Tests, keine Secrets. Ein uebersprungener Test gilt nicht als bestanden. Keine interaktive Abnahme (#186).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/jarvis/browser/**'
      - 'src/jarvis/research/**'
      - 'tests/test_browser_real.py'
      - 'tests/test_research_real_browser.py'
      - '.github/workflows/browser-research.yml'

permissions:
  contents: read

concurrency:
  group: browser-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-browser:
    name: real-browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install (CI only)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev,browser]"
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium; else python -m playwright install chromium; fi
      - name: Real-browser tests
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest -v -rfEs tests/test_browser_real.py tests/test_research_real_browser.py --junitxml=reports/junit-real-browser.xml
      - name: Fail on skipped or missing tests (a skipped test is not a pass)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("reports/junit-real-browser.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"tests={tests} skipped={skipped} failed={failed}")
          if tests < 20 or skipped or failed:
              sys.exit(f"nicht bestanden: tests={tests} (mindestens 20 erwartet), skipped={skipped}, failed={failed}")
          PY
      - name: Upload report, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-browser-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
