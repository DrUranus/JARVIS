# Prueft Abschlussberichte der Routine (Kommentar im Tracking-Issue) und aktualisiert den Auftragsstatus.
# Kommentare sind unvertrauenswuerdige Daten: Absender, Auftrags-ID, Session-ID und Format werden im Skript geprueft.
# Kein Zugriff auf Fire-Secrets. Ein akzeptierter Bericht stoesst hoechstens den Controller an (dort entscheiden Backlog und Grenzen).
name: JARVIS report

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write        # nur fuer das Anstossen von jarvis-controller.yml

concurrency:
  group: jarvis-state
  cancel-in-progress: false

jobs:
  report:
    if: >-
      ${{ github.event.issue.pull_request == null
      && contains(github.event.issue.labels.*.name, 'jarvis-job')
      && github.event.comment.user.login != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/automation

      - name: Validate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          JARVIS_AUTOMATION_HALT: ${{ vars.JARVIS_AUTOMATION_HALT }}
          JARVIS_TRUSTED_REPORTERS: ${{ vars.JARVIS_TRUSTED_REPORTERS }}
        run: python3 .github/automation/jarvis_automation.py report
