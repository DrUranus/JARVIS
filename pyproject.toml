[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai"
version = "0.1.0"
description = "JARVIS - modular personal autonomous AI assistant (Phase 1: Core MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mss>=9.0; sys_platform == 'win32'", "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'"]  # mss: real capture tests on Windows
computer = ["pyautogui>=0.9.54", "mss>=9.0", "python-xlib>=0.33; sys_platform != 'win32'"]  # mouse/keyboard/screenshots
browser = ["playwright>=1.49"]  # browser agent (then: python -m playwright install chromium; Edge/Chrome need no download)
uia = ["pywinauto>=0.6.9,<0.7; sys_platform == 'win32'"]  # read-only Windows UI Automation (docs/integrations/windows-uia.md); Windows only, imported lazily
voice = ["sounddevice>=0.4", "numpy>=1.24"]   # microphone capture (needs the PortAudio system library); numpy: SystemPlayer on Windows plays through sounddevice with numpy samples
stt-local = ["faster-whisper>=1.1.0", "numpy>=1.24"]   # optional local speech recognition (docs/integrations/stt-local.md); model from a local directory only, imported lazily
ui = ["pywebview>=6.2.1,<7; sys_platform == 'win32'"]   # optional Windows mini overlay of the control center (docs/CC_MINI_OVERLAY_REVIEW.md); off by default, imported lazily
research = ["trafilatura>=2.3.1"]   # optional HTML text extraction backend (docs/integrations/research.md); imported lazily, default stays the stdlib backend

[project.scripts]
jarvis = "jarvis.interface.cli:main"
jarvis-gui = "jarvis.interface.gui:main"   # needs tkinter (bundled with the python.org / setup-python builds on Windows)
jarvis-cc = "jarvis.control_center.launcher:main"   # Control Center (local web UI, 127.0.0.1 only); needs control_center.enabled + assistant.enabled, starts only on this command

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.control_center" = ["web/*"]   # local HTML/JS/CSS of the control center (cc-shell)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "detection_only: checks a detection heuristic or a static filter (AST scan, allow-list, prompt rendering). It does NOT prove isolation and does not authorise running proposed code.",
]
