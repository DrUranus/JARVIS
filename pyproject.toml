[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai"
version = "0.1.0"
description = "JARVIS - modular personal autonomous AI assistant (Phase 1: Core MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
computer = ["pyautogui>=0.9.54", "mss>=9.0", "python-xlib>=0.33; sys_platform != 'win32'"]  # mouse/keyboard/screenshots
voice = ["sounddevice>=0.4"]   # microphone capture (needs the PortAudio system library)

[project.scripts]
jarvis = "jarvis.interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
