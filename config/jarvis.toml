# JARVIS default project configuration.
# Precedence (low -> high): built-in defaults < this file < environment variables (JARVIS_*).
mode = "development"        # development | production
log_level = "INFO"          # overridden to DEBUG in development if not set via env
log_dir = "logs"
workspace = "workspace"     # sandbox directory for GREEN file operations

[llm]
provider = "mock"           # mock | openai | anthropic  (API keys come from env only)
model = "mock-1"
temperature = 0.2
max_tokens = 1024
timeout = 60

[voice]
# console = hardware-free simulation (typed lines are "speech", output is printed). Works everywhere.
stt_provider = "console"    # console | mock | openai
tts_provider = "console"    # console | mock | system | openai
audio_input = "sounddevice" # microphone backend for non-console STT
audio_output = "system"     # playback backend for openai TTS (system | null)
language = "de"
wake_word = "jarvis"
require_wake_word = false   # true: only react to utterances starting with the wake word
speak_responses = true
sample_rate = 16000
max_record_seconds = 15.0
silence_seconds = 1.0       # silence that ends an utterance
silence_threshold = 500     # RMS level counted as speech
stt_model = "whisper-1"
tts_model = "tts-1"
tts_voice = "alloy"
# tts_command = "espeak-ng -v de"   # override for tts_provider = "system"
# API key: OPENAI_API_KEY or JARVIS_VOICE_API_KEY (environment only)

[memory]
enabled = true
backend = "sqlite"          # sqlite | memory (non-persistent)
path = "data/memory.db"     # created on first write; stays on this machine
max_relevant = 5            # memories retrieved per request (0 = none)
recent_limit = 10
max_content_length = 2000
max_entries = 10000         # 0 = unlimited
use_in_prompts = false      # true = relevant memories are added to LLM prompts (sent to the provider if it is remote!)

[security]
# Defaults are restrictive; no setting here is required to start JARVIS.
mode = "standard"           # standard: GREEN automatic, YELLOW asks you | lockdown: only GREEN, everything else denied
confirmation = "cli"        # cli: ask in the terminal | deny: never ask (headless; YELLOW is denied)
# policy_file = "config/policy.toml"   # explicit allow/confirm/deny rules, see config/policy.example.toml
allowed_roots = []          # [] = tools may only touch the workspace directory (workspace = ... above)
denied_paths = []           # always blocked, even inside allowed roots
allow_session_grants = true # may you answer "allow for this session"?
session_ttl_seconds = 3600
audit_enabled = true
audit_path = ""             # "" = <log_dir>/audit.jsonl
audit_strict = true         # audit log unwritable -> non-GREEN actions are denied
audit_green = false         # also log automatic GREEN approvals (verbose)
# RED actions are never permitted; there is deliberately no setting that changes that.

[computer]
# Computer control is OFF by default. Enable it deliberately; every action still goes through the permission engine.
enabled = false
backend = "auto"            # auto (windows on Windows, x11 elsewhere) | windows | x11 | fake
default_monitor = 0         # 0 = primary monitor
screenshot_max_items = 3    # screenshots stay in memory only; saving to disk is an explicit, confirmed action
max_text_length = 500
type_interval = 0.02
max_scroll = 20
max_actions_per_minute = 120
show_text_preview = true    # show the beginning of text to be typed in the confirmation prompt (never logged)
confirm_keyboard_each_time = true
confirm_window_close_each_time = true
use_default_apps = true     # Notepad/Calculator/Paint aliases on Windows
allow_unlisted_apps = false # true: absolute .exe paths may be launched (still confirmed and filtered)
blocked_processes = ["explorer.exe"]  # extra processes that receive no input (built-in: terminals, shells, security tools...)
blocked_titles = []
# Application aliases: only these can be launched (unless allow_unlisted_apps). Terminals/shells/script hosts are always refused.
# [computer.apps]
# notepad = "%SystemRoot%\\System32\\notepad.exe"
