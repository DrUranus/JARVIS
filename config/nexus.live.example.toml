# JARVIS NEXUS: Beispiel fuer den "echten" Betrieb (echtes LLM, Browser-Recherche, optional Brave-Websuche). Ausdruecklich opt-in, KEINE Schluessel in dieser Datei.
# Nutzung: Kopie anlegen (z. B. config\nexus.live.toml, ist nicht Teil des Repositorys), Abschnitte anpassen, dann
#   $env:ANTHROPIC_API_KEY = "..."                     # NUR in dieser PowerShell-Sitzung; nie in eine Datei schreiben
#   $env:BRAVE_SEARCH_API_KEY = "..."                  # nur fuer die Websuche
#   .\.venv\Scripts\jarvis-cc.exe -c config\nexus.live.toml --open
# Alles unten aendert KEINE Sicherheitseinstellung: [security] fehlt absichtlich (YELLOW fragt im NEXUS-Dialog, RED nie, Audit strikt, Notaus bleibt).
# Dies ist eine Ergaenzung zu config\nexus.example.toml: diese Abschnitte [control_center] [assistant] [agents] [goals] [journal] [files] muessen ebenfalls vorhanden sein.

[control_center]
enabled = true
[assistant]
enabled = true
confirmation_timeout_seconds = 120
[agents]
enabled = true
[agents.router]
enabled = true
[goals]
enabled = true
# llm_planning = true      # erst einschalten, wenn das echte LLM laeuft (Plan wird geprueft, sonst Vorlagen-Rueckfall)
[journal]
enabled = true
path = "data/journal.db"
[files]
enabled = true
roots = ["workspace"]

[llm]                      # Standard ist "mock": ohne diesen Abschnitt antwortet JARVIS nur "[mock] Ich habe verstanden ..."
provider = "anthropic"     # anthropic | openai | openai_compatible; Schluessel: ANTHROPIC_API_KEY bzw. OPENAI_API_KEY bzw. OPENAI_COMPATIBLE_API_KEY (nur Umgebung)
model = "claude-sonnet-5-5"
temperature = 0.2
max_tokens = 1024
timeout = 60

[browser]
enabled = true             # Playwright; braucht ".[browser]" und "python -m playwright install chromium" (Version muss zu Playwright passen)
headless = true
# executable_path = ""     # nur falls ein anderes Chromium/Chrome/Edge genutzt werden soll (z. B. "C:/Program Files/Google/Chrome/Application/chrome.exe")

[research]
enabled = true             # liest oeffentliche Webseiten ueber das berechtigungsgepruefte Browser-Werkzeug
search_enabled = false     # true = Websuche ueber Brave (kostet Geld, sendet den Suchtext an api.search.brave.com); braucht BRAVE_SEARCH_API_KEY in der Umgebung
